<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Create Pace shuffle preview</title>
  <link rel="stylesheet" href="phone.css" />
</head>
<body class="solo">
  <div class="phone pace-screen">
    <div class="status-bar"><span>9:41</span><span>●●●</span></div>
    <div class="content">
      <div class="screen-title">Table settings</div>
      <div class="section">PACE</div>
      <div class="tile">
        <div>
          <h3>Bidding timer</h3>
          <p>Off — bids wait for everyone</p>
        </div>
        <div class="switch"></div>
      </div>
      <div class="tile">
        <div>
          <h3>Play timer</h3>
          <p>Off — nobody is auto-played</p>
        </div>
        <div class="switch"></div>
      </div>
      <div class="tile highlight">
        <div>
          <h3>Dealer shuffle</h3>
          <p>On — everyone watches the shuffle; dealer deals when ready</p>
        </div>
        <div class="switch on"></div>
      </div>
    </div>
  </div>
</body>
</html>
