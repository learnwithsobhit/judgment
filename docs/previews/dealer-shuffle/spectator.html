<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Spectator shuffle preview</title>
  <link rel="stylesheet" href="phone.css" />
</head>
<body class="solo">
  <div class="phone spectator">
    <div class="status-bar"><span>9:41</span><span>●●●</span></div>
    <div class="seats">
      <div class="seat top-left"><div class="avatar">DC</div><div class="seat-name">Dharmendra</div></div>
      <div class="seat top dealer"><div class="avatar">P</div><div class="seat-name">Priya</div><div class="dealer-tag">dealer</div></div>
      <div class="seat top-right"><div class="avatar">CJ</div><div class="seat-name">Chandan</div></div>
      <div class="seat left"><div class="avatar">GC</div><div class="seat-name">Gagan</div></div>
      <div class="seat right"><div class="avatar">UC</div><div class="seat-name">Upavan</div></div>
    </div>
    <div class="stage">
      <div class="deck washing">
        <div class="card-back"></div><div class="card-back"></div>
        <div class="card-back"></div><div class="card-back"></div>
      </div>
      <p class="status">Round 3 · Priya is shuffling</p>
      <div class="countdown"><i></i></div>
      <p class="meta" style="margin-top:8px">8s · everyone can see this</p>
    </div>
    <div class="action-band">
      <div class="hand-slot">Your hand deals after the shuffle</div>
    </div>
  </div>
</body>
</html>
