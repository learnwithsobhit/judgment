# Fly.io app config for judgement-server.
# Deploy from repo root: fly deploy
# Docs: docs/runbooks/deploy.md

app = 'judgment-api'
primary_region = 'sin'

[build]
  dockerfile = 'deployment/docker/Dockerfile'

[env]
  RUST_LOG = 'info'
  PORT = '8080'
  JUDGEMENT_MIGRATIONS_DIR = '/srv/migrations/persistence'
  RAG_ENABLED = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

# 4GB requires performance CPU on Fly (shared-cpu-1x caps at 2GB).
[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
