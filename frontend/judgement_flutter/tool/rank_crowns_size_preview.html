<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rank crowns size preview</title>
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px 48px;
      font-family: system-ui, sans-serif; color: #f3efe6;
      background: radial-gradient(ellipse at 50% 10%, #1a5c44, #071c16 60%);
    }
    h1 { text-align: center; color: #ffd56a; font-family: Georgia, serif; font-size: 1.25rem; }
    .sub { text-align: center; opacity: 0.7; font-size: 0.85rem; margin-bottom: 22px; }
    .row { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
    .card {
      width: 200px; text-align: center; padding: 16px 12px;
      background: rgba(0,0,0,0.25); border-radius: 14px;
      border: 1px solid rgba(255,213,106,0.18);
    }
    .stage { position: relative; width: 120px; height: 150px; margin: 0 auto 10px; }
    .avatar {
      position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(145deg, #4a7a66, #1c3f33);
      border: 3px solid rgba(212,175,55,0.55);
      display: grid; place-items: center; color: rgba(255,255,255,0.45); font-weight: 700;
    }
    .crown {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 72px; height: 68px; object-fit: contain;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    }
    .sizes { display: flex; gap: 28px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    .size-item { text-align: center; }
    .size-item img { display: block; margin: 0 auto 6px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
    .meta { font-size: 0.75rem; opacity: 0.65; }
  </style>
</head>
<body>
  <h1>Overall rank crowns — size check</h1>
  <p class="sub">Gold / silver / bronze imperial icons on avatar rim (same placement as old caps)</p>
  <div class="row">
    <div class="card">
      <div class="stage">
        <img class="crown" src="/assets/badges/rank_crown_gold.png" alt="gold" />
        <div class="avatar">1</div>
      </div>
      <strong>Gold · 1st</strong>
      <div class="meta">radius ~26</div>
    </div>
    <div class="card">
      <div class="stage">
        <img class="crown" src="/assets/badges/rank_crown_silver.png" alt="silver" />
        <div class="avatar">2</div>
      </div>
      <strong>Silver · 2nd</strong>
      <div class="meta">radius ~26</div>
    </div>
    <div class="card">
      <div class="stage">
        <img class="crown" src="/assets/badges/rank_crown_bronze.png" alt="bronze" />
        <div class="avatar">3</div>
      </div>
      <strong>Bronze · 3rd</strong>
      <div class="meta">radius ~26</div>
    </div>
  </div>
  <div class="sizes">
    <div class="size-item">
      <img src="/assets/badges/rank_crown_gold.png" width="36" height="34" alt="" />
      <div class="meta">scoreboard ~12–16</div>
    </div>
    <div class="size-item">
      <img src="/assets/badges/rank_crown_gold.png" width="48" height="46" alt="" />
      <div class="meta">table ~20</div>
    </div>
    <div class="size-item">
      <img src="/assets/badges/rank_crown_gold.png" width="72" height="68" alt="" />
      <div class="meta">victory ~28</div>
    </div>
  </div>
</body>
</html>
