<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bid. Trump. Brag. Free multiplayer Judgement (Oh Hell) with friends — play in the browser.">
  <meta name="theme-color" content="#0B3D2E">

  <!-- Open Graph / WhatsApp / iMessage link previews (absolute URLs required) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Judgement">
  <meta property="og:title" content="Judgement — Bid. Trump. Brag.">
  <meta property="og:description" content="Free multiplayer Judgement with friends. Exact bids, trump, and brag-worthy finishes — in about 15 minutes.">
  <!-- Absolute OG URLs stamped from PUBLIC_WEB_ORIGIN (__WEB_ORIGIN__ placeholders below). -->
  <meta property="og:url" content="__WEB_ORIGIN__/">
  <meta property="og:image" content="__WEB_ORIGIN__/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Judgement — Bid. Trump. Brag.">
  <meta name="twitter:description" content="Free multiplayer Judgement with friends. Exact bids, trump, and brag-worthy finishes.">
  <meta name="twitter:image" content="__WEB_ORIGIN__/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Judgement">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon (query busts browsers that cached the old Flutter default) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Judgement — Bid. Trump. Brag.</title>
  <link rel="manifest" href="manifest.json">
  <!-- Help Safari avoid sticky document cache (in addition to Hosting headers). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <!--
    Boot gate: compare stamped WINDOW_APP_BUILD_ID to /version.json before
    loading Flutter. stamp_web_build.sh replaces BUILD_ID placeholders.
    Builds use --pwa-strategy=none so a new SW is not re-registered.
  -->
  <script>
    (async function () {
      var WINDOW_APP_BUILD_ID = 'BUILD_ID';

      async function clearWorkersAndCaches() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }
        } catch (e) {}
      }

      function loadFlutter() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(WINDOW_APP_BUILD_ID);
        s.async = true;
        document.body.appendChild(s);
      }

      function bustNavigate(remoteBuildId) {
        var url = new URL(window.location.href);
        url.searchParams.delete('_b');
        url.searchParams.delete('_r');
        url.searchParams.set('_b', remoteBuildId);
        // Force a fresh document fetch even if only query order changed.
        url.searchParams.set('_r', String(Date.now()));
        window.location.replace(url.toString());
      }

      await clearWorkersAndCaches();

      var urlBuild = new URL(window.location.href).searchParams.get('_b');
      // Already navigated for this shell — avoid reload loops.
      if (urlBuild && urlBuild === WINDOW_APP_BUILD_ID) {
        loadFlutter();
        return;
      }

      try {
        var res = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          var data = await res.json();
          var remote = data && data.build_id ? String(data.build_id) : '';
          if (remote && remote !== WINDOW_APP_BUILD_ID) {
            bustNavigate(remote);
            return;
          }
        }
      } catch (e) {
        // Offline / blocked — proceed with stamped shell.
      }

      loadFlutter();
    })();
  </script>
</body>
</html>
