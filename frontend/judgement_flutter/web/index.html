<body>
  <!--
    Clear stale Flutter service workers BEFORE loading the app so an old SW
    cannot serve a cached shell. stamp_web_build.sh replaces BUILD_ID.
    Builds use --pwa-strategy=none so a new SW is not re-registered.
  -->
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }
      } catch (e) {}
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=BUILD_ID';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
