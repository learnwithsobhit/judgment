services:
  postgres:
    # pgvector image required for Phase 7b RAG (ADR 0002).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: judgement
      POSTGRES_PASSWORD: judgement
      POSTGRES_DB: judgement
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgement -d judgement"]
      interval: 2s
      timeout: 5s
      retries: 15
