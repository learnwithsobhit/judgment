[package]
name = "dehla-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dehla-server"
path = "src/main.rs"

[dependencies]
dehla-domain = { workspace = true }
dehla-engine = { workspace = true }
dehla-protocol = { workspace = true }
dehla-persistence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std", "async-await"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
