[workspace]
resolver = "2"
members = [
    "crates/judgement-domain",
    "crates/judgement-engine",
    "crates/judgement-bot",
    "crates/judgement-protocol",
    "crates/judgement-server",
    "crates/judgement-persistence",
    "crates/judgement-ai",
    "crates/judgement-rag",
    "crates/judgement-analytics",
    "crates/dehla-domain",
    "crates/dehla-engine",
    "crates/dehla-protocol",
    "crates/dehla-persistence",
    "crates/dehla-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rand = "0.9"
rand_chacha = "0.9"
proptest = "1"

judgement-domain = { path = "crates/judgement-domain" }
judgement-engine = { path = "crates/judgement-engine" }
judgement-bot = { path = "crates/judgement-bot" }
judgement-protocol = { path = "crates/judgement-protocol" }
judgement-persistence = { path = "crates/judgement-persistence" }
judgement-ai = { path = "crates/judgement-ai" }
judgement-rag = { path = "crates/judgement-rag" }
judgement-analytics = { path = "crates/judgement-analytics" }

dehla-domain = { path = "crates/dehla-domain" }
dehla-engine = { path = "crates/dehla-engine" }
dehla-protocol = { path = "crates/dehla-protocol" }
dehla-persistence = { path = "crates/dehla-persistence" }
