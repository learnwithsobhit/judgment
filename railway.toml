# Railway config-as-code for judgement-server.
# Dashboard: connect this repo, add a Postgres plugin, set env from
# deployment/railway.env.example (see docs/runbooks/deploy.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "deployment/docker/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
