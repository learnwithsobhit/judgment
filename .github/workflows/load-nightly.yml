name: Load nightly (ephemeral)

on:
  schedule:
    # 02:15 UTC daily
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "k6 scenario (ephemeral only)"
        required: true
        default: comfort
        type: choice
        options:
          - comfort
          - target
          - stress
          - admission
          - smoke_ws

concurrency:
  group: load-nightly
  cancel-in-progress: true

jobs:
  load-ephemeral:
    name: Load ephemeral (${{ github.event.inputs.scenario || 'comfort' }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: judgement
          POSTGRES_PASSWORD: judgement
          POSTGRES_DB: judgement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judgement -d judgement"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Build judgement-server
        working-directory: backend
        run: cargo build --release -p judgement-server
      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgres://judgement:judgement@127.0.0.1:5432/judgement
          JUDGEMENT_ALLOW_SEED: "1"
          HTTP_GUEST_RATE_LIMIT: "10000"
          HTTP_RATE_LIMIT: "100000"
          RAG_ENABLED: "0"
          PORT: "8080"
          RUST_LOG: info
        run: |
          ./target/release/judgement-server > /tmp/judgement-api.log 2>&1 &
          echo $! > /tmp/judgement-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz | grep -qi ready; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready" >&2
          cat /tmp/judgement-api.log >&2 || true
          exit 1
      - name: Metrics before
        run: ./deployment/load/scrape_metrics.sh before /tmp/metrics-before.txt
        env:
          API_BASE: http://127.0.0.1:8080
      - name: k6 scenario
        run: ./deployment/load/run.sh "${{ github.event.inputs.scenario || 'comfort' }}"
        env:
          API_BASE: http://127.0.0.1:8080
          THRESHOLDS_PROFILE: ${{ github.event.inputs.scenario == 'target' && 'strict' || 'ci' }}
          K6_SUMMARY: ${{ github.workspace }}/k6-summary.json
      - name: Metrics after / diff
        if: always()
        run: |
          ./deployment/load/scrape_metrics.sh after /tmp/metrics-after.txt
          ./deployment/load/scrape_metrics.sh diff /tmp/metrics-before.txt /tmp/metrics-after.txt
        env:
          API_BASE: http://127.0.0.1:8080
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-nightly-${{ github.event.inputs.scenario || 'comfort' }}
          path: |
            k6-summary.json
            /tmp/metrics-before.txt
            /tmp/metrics-after.txt
            /tmp/judgement-api.log
          if-no-files-found: ignore
      - name: Stop API
        if: always()
        run: |
          if [[ -f /tmp/judgement-api.pid ]]; then
            kill "$(cat /tmp/judgement-api.pid)" || true
          fi
