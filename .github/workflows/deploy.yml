name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API (Fly.io)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN unset — cannot deploy API."
            echo "Create a deploy token: fly tokens create deploy -a judgment-api"
            echo "Add it as GitHub secret FLY_API_TOKEN."
            exit 1
          fi
          flyctl deploy --remote-only

  deploy-web:
    name: Deploy Web (Firebase)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require API_BASE
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "Set GitHub Actions variable API_BASE to the Fly public HTTPS URL"
            echo "(no trailing slash), e.g. https://judgment-api.fly.dev"
            exit 1
          fi
          echo "API_BASE=$API_BASE"
      - name: Build Flutter Web
        working-directory: frontend/judgement_flutter
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          flutter pub get
          chmod +x tool/build_web_release.sh tool/stamp_web_build.sh
          API_BASE="$API_BASE" ./tool/build_web_release.sh
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Hosting
        working-directory: frontend/judgement_flutter
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret missing — skip hosting deploy"
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID variable missing — skip hosting deploy"
            exit 1
          fi
          firebase deploy --only hosting:prod \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

  smoke:
    name: Post-deploy smoke
    needs: [deploy-api, deploy-web]
    if: always() && needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Health checks
        env:
          API_BASE: ${{ vars.API_BASE }}
          WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -n "${API_BASE:-}" ]; then
            echo "Checking $API_BASE/healthz"
            curl -fsS "$API_BASE/healthz" | tee /tmp/healthz
            echo "Checking $API_BASE/readyz"
            curl -fsS "$API_BASE/readyz" | tee /tmp/readyz
          else
            echo "API_BASE unset — skip API smoke"
          fi
          if [ -n "${WEB_ORIGIN:-}" ]; then
            echo "Checking $WEB_ORIGIN/"
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "$WEB_ORIGIN/" || true)
            echo "HTTP $code"
            case "$code" in
              200|301|302) ;;
              *) echo "Unexpected status"; exit 1 ;;
            esac

            assert_cache() {
              local path="$1"
              local expect="$2"
              local hdr
              hdr=$(curl -fsSI "$WEB_ORIGIN$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print tolower($2); exit}')
              echo "$path Cache-Control: ${hdr:-<missing>}"
              case "$hdr" in
                *"$expect"*) ;;
                *)
                  echo "Expected Cache-Control containing '$expect' for $path"
                  exit 1
                  ;;
              esac
            }

            assert_cache "/" "no-store"
            assert_cache "/index.html" "no-store"
            assert_cache "/flutter_bootstrap.js" "no-store"
            assert_cache "/main.dart.js" "no-store"
            assert_cache "/version.json" "no-store"
            assert_cache "/assets/AssetManifest.bin" "no-store"

            echo "Checking $WEB_ORIGIN/version.json build_id"
            body=$(curl -fsS "$WEB_ORIGIN/version.json")
            echo "$body"
            echo "$body" | grep -q '"build_id"'
          else
            echo "PUBLIC_WEB_ORIGIN unset — skip web smoke"
          fi
