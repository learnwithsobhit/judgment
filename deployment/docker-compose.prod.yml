# Production-shaped stack for local verification (PLAN.md §25.1).
# From judgement/: docker compose -f deployment/docker-compose.prod.yml up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: judgement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: judgement
    volumes:
      - judgement_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgement -d judgement"]
      interval: 5s
      timeout: 5s
      retries: 10

  judgement-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://judgement:${POSTGRES_PASSWORD:-changeme}@postgres:5432/judgement
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088}
      HTTP_RATE_LIMIT: ${HTTP_RATE_LIMIT:-120}
      HTTP_GUEST_RATE_LIMIT: ${HTTP_GUEST_RATE_LIMIT:-20}
      RAG_ENABLED: ${RAG_ENABLED:-0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  judgement_pg:
