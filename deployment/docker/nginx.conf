# Example TLS-terminating reverse proxy in front of judgement-server + Flutter static.
# Adjust server_name, cert paths, and upstream as needed.

upstream judgement_api {
    server judgement-server:8080;
}

server {
    listen 443 ssl http2;
    server_name play.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Flutter Web static build (flutter build web --release)
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://judgement_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/games/ {
        proxy_pass http://judgement_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /healthz { proxy_pass http://judgement_api; }
    location /readyz  { proxy_pass http://judgement_api; }
    location /metrics { proxy_pass http://judgement_api; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
