# Railway config-as-code for dehla-server (separate service from Judgement).
# Create a new Railway service pointing at this file / Dockerfile.dehla.
# See docs/adr/0006-multi-game-platform.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deployment/docker/Dockerfile.dehla"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
